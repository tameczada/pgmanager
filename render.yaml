services:
  - type: web
    name: pgmanager
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: APP_PASSWORD
        generateValue: true   # senha gerada pelo Render (veja em Environment)
